    <style>
      /* 세로 스크롤바 유무에 따른 좌우 레이아웃 시프트 방지 */
      html, body {
        scrollbar-gutter: stable;
      }

      /* 대제목, 헤딩, 굵은 텍스트는 굵고 선명한 Jalnan2 적용 */
      h1, h2, h3, h4, h5, h6,
      .MuiTypography-h1, .MuiTypography-h2, .MuiTypography-h3,
      .MuiTypography-h4, .MuiTypography-h5, .MuiTypography-h6,
      .MuiButton-root,
      [style*="font-weight: 800"],
      [style*="font-weight: 700"] {
        font-family: 'Jalnan2', sans-serif !important;
      }

      /* 표 컬럼 헤더는 무조건 여기어때 잘난체(Jalnan2) 적용 */
      th,
      .MuiTableCell-head,
      thead th,
      .MuiTableHead-root .MuiTableCell-root {
        font-family: 'Jalnan2', sans-serif !important;
        font-weight: 800 !important;
      }

      /* 회색 보조 텍스트, 설명 문구, 본문 보조는 얇은 버전의 잘난체(JalnanGothic) 적용 */
      .MuiTypography-colorTextSecondary,
      [color="text.secondary"],
      .text-secondary,
      .text-dim,
      .text-muted,
      .MuiTypography-caption,
      small {
        font-family: 'JalnanGothic', 'NPSfont', sans-serif !important;
        font-weight: 400 !important;
      }
    </style>
